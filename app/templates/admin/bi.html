{% extends "base.html" %}

{% block title %}BI Dashboard - BusCore{% endblock %}

{% block content %}

<!--  -->
<!-- BI Container -->
<!--  -->
<div class="bi-container">

    <!-- Top Bar -->
    <div class="bi-topbar">
        <div class="bi-topbar-left">
            <a href="/admin/dashboard" class="bi-back-btn" title="{{ _('عودة') }}">
                <i class="fas fa-arrow-{% if lang == 'ar' %}right{% else %}left{% endif %}"></i>
            </a>
            <div class="bi-brand">
                <i class="fas fa-chart-pie"></i>
                <span>BusCore Analytics</span>
            </div>
            <div class="bi-divider"></div>
            <div class="bi-page-title">
                <i class="fas fa-chart-line"></i>
                <span>{{ _("لوحة تحليل البيانات") }}</span>
            </div>
        </div>
        <div class="bi-topbar-right">
            <div class="bi-range-group" id="rangeFilter">
                <button type="button" class="bi-range-btn" data-range="today">{{ _("اليوم") }}</button>
                <button type="button" class="bi-range-btn" data-range="week">{{ _("7 أيام") }}</button>
                <button type="button" class="bi-range-btn active" data-range="month">{{ _("هذا الشهر") }}</button>
                <button type="button" class="bi-range-btn" data-range="year">{{ _("هذا العام") }}</button>
                <button type="button" class="bi-range-btn" id="customRangeBtn" onclick="toggleDateRangePicker(event)" title="نطاق مخصص">
                    <i class="fas fa-calendar-alt"></i>
                </button>
            </div>
            <div class="date-range-picker ${LANG === 'ar' ? 'rtl' : 'ltr'}" id="dateRangePicker">
                <label>من تاريخ</label>
                <input type="date" id="dateFrom">
                <label>إلى تاريخ</label>
                <input type="date" id="dateTo">
                <div class="date-range-actions">
                    <button class="apply-btn" onclick="applyCustomRange()">
                        <i class="fas fa-check"></i> تطبيق
                    </button>
                    <button class="cancel-btn" onclick="closeDateRangePicker()">
                        إلغاء
                    </button>
                </div>
            </div>
            <div class="compare-select-wrap">
                <i class="fas fa-balance-scale"></i>
                <select class="compare-select" id="compareSelect" onchange="onCompareChange(this.value)">
                    <option value="">لا مقارنة</option>
                    <option value="prev_month">vs الشهر السابق</option>
                    <option value="prev_year">vs السنة السابقة</option>
                </select>
            </div>
            <div class="auto-refresh-wrap" id="autoRefreshWrap">
                <i class="fas fa-sync-alt"></i>
                <select class="auto-refresh-select" id="autoRefreshSelect" onchange="onAutoRefreshChange(this.value)">
                    <option value="0">إيقاف التحديث</option>
                    <option value="30">كل 30 ثانية</option>
                    <option value="60">كل دقيقة</option>
                    <option value="300">كل 5 دقائق</option>
                </select>
            </div>
            <div class="bi-live">
                <span class="bi-live-dot"></span>
                <span>LIVE</span>
                <span class="bi-live-time" id="lastUpdate">--:--</span>
            </div>
            <button class="bi-refresh" onclick="refreshAll()" title="{{ _('تحديث') }}">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </div>

    <!-- Tabs -->
    <div class="bi-tabs">
        <button class="bi-tab active" onclick="switchTab('overview', event)">
            <i class="fas fa-chart-line"></i> {{ _("نظرة عامة") }}
        </button>
        <button class="bi-tab" onclick="switchTab('branches', event)">
            <i class="fas fa-building"></i> {{ _("الفروع") }}
        </button>
        <button class="bi-tab" onclick="switchTab('buses', event)">
            <i class="fas fa-bus"></i> {{ _("الحافلات") }}
        </button>
        <button class="bi-tab" onclick="switchTab('employees', event)">
            <i class="fas fa-users"></i> {{ _("الموظفون") }}
        </button>
        <button class="bi-tab" onclick="switchTab('trips', event)">
            <i class="fas fa-route"></i> {{ _("الرحلات") }}
        </button>
        <button class="bi-tab" onclick="switchTab('cities', event)">
            <i class="fas fa-map-marked-alt"></i> {{ _("المدن") }}
        </button>
        <button class="bi-tab" onclick="switchTab('financial', event)">
            <i class="fas fa-money-bill-wave"></i> {{ _("المالية") }}
        </button>
        <button class="bi-tab" onclick="switchTab('customers', event)">
            <i class="fas fa-user-friends"></i> {{ _("العملاء") }}
        </button>
        <button class="bi-tab" onclick="switchTab('recommendations', event)">
            <i class="fas fa-lightbulb"></i> {{ _("التوصيات") }}
        </button>
    </div>

    <!-- Content -->
    <div id="biContent">
        <div class="bi-loading">
            <div class="spinner-border text-primary"></div>
            <p>{{ _("جاري التحميل...") }}</p>
        </div>
    </div>

</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
// 
// Config
// 
const LANG = "{{ lang }}";
let currentRange = 'month';
let compareWith = '';
let customFromDate = '';
let customToDate = '';
let autoRefreshTimer = null;
let autoRefreshSeconds = 0;
let currentTab = 'overview';
let charts = {};
let biData = null;

// Chart.js Defaults
Chart.defaults.responsive = true;
Chart.defaults.maintainAspectRatio = false;
Chart.defaults.font.family = "'Tajawal', 'Cairo', sans-serif";
Chart.defaults.font.size = 10;
Chart.defaults.color = '#64748b';
Chart.defaults.plugins.legend.labels.padding = 8;
Chart.defaults.plugins.legend.labels.boxWidth = 10;
Chart.defaults.plugins.legend.labels.font = { size: 9 };
Chart.defaults.plugins.legend.position = 'bottom';
Chart.defaults.layout.padding = 4;
Chart.defaults.elements.point.radius = 0;
Chart.defaults.elements.point.hoverRadius = 4;
Chart.defaults.elements.line.borderWidth = 2;
Chart.defaults.elements.bar.borderRadius = 4;

// 
// Init
// 
document.addEventListener('DOMContentLoaded', async function() {
    document.querySelectorAll('#rangeFilter .bi-range-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('#rangeFilter .bi-range-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentRange = this.dataset.range;
            refreshAll();
        });
    });

    await refreshAll();
    setInterval(() => { if (currentTab === 'overview') loadOverview(); }, 60000);
});

async function refreshAll() {
    switchTab(currentTab);
    updateLastUpdate();
}


// 
// Compare helpers
// 

// 
// onCompareChange  يُستدعى عند تغيير خيار المقارنة
// 
function onCompareChange(value) {
    compareWith = value || '';
    // إعادة تحميل التبويب الحالي
    if (typeof switchTab === 'function') {
        switchTab(currentTab);
    }
    if (typeof refreshAll === 'function') {
        updateLastUpdate();
    }
}

// 
// إغلاق Date Range Picker عند النقر خارجها
// 
document.addEventListener('click', function(e) {
    const picker = document.getElementById('dateRangePicker');
    const customBtn = document.getElementById('customRangeBtn');
    if (!picker || !customBtn) return;
    if (!picker.contains(e.target) && !customBtn.contains(e.target)) {
        picker.classList.remove('open');
    }
});

// 
// استرجاع تفضيل Auto-refresh + تعيين التواريخ
// 
document.addEventListener('DOMContentLoaded', function() {
    // استرجاع Auto-refresh
    try {
        const saved = localStorage.getItem('bi_autoRefresh');
        if (saved && saved !== '0') {
            const sel = document.getElementById('autoRefreshSelect');
            if (sel) {
                sel.value = saved;
                onAutoRefreshChange(saved);
            }
        }
    } catch(e) {}
});


// 
// Date Range Picker
// 
function toggleDateRangePicker(event) {
    if (event) event.stopPropagation();
    const picker = document.getElementById('dateRangePicker');
    if (!picker) return;
    picker.classList.toggle('open');
    
    // إغلاق Auto-refresh و المقارنة عند الفتح
    if (picker.classList.contains('open')) {
        // ضبط التواريخ الحالية
        const fromInput = document.getElementById('dateFrom');
        const toInput = document.getElementById('dateTo');
        if (fromInput && !fromInput.value) {
            const today = new Date();
            const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
            fromInput.value = firstDay.toISOString().slice(0, 10);
        }
        if (toInput && !toInput.value) {
            toInput.value = new Date().toISOString().slice(0, 10);
        }
    }
}

function closeDateRangePicker() {
    const picker = document.getElementById('dateRangePicker');
    if (picker) picker.classList.remove('open');
}

function applyCustomRange() {
    const fromInput = document.getElementById('dateFrom');
    const toInput = document.getElementById('dateTo');
    
    if (!fromInput || !toInput || !fromInput.value || !toInput.value) {
        alert('الرجاء تحديد التاريخين');
        return;
    }
    
    customFromDate = fromInput.value;
    customToDate = toInput.value;
    currentRange = 'custom';
    
    // تحديث الأزرار
    document.querySelectorAll('#rangeFilter .bi-range-btn').forEach(b => b.classList.remove('active', 'custom-active'));
    const customBtn = document.getElementById('customRangeBtn');
    if (customBtn) customBtn.classList.add('custom-active');
    
    closeDateRangePicker();
    refreshAll();
}

// 
// Auto Refresh
// 
function onAutoRefreshChange(value) {
    const seconds = parseInt(value) || 0;
    autoRefreshSeconds = seconds;
    
    // إلغاء المؤقت الحالي
    if (autoRefreshTimer) {
        clearInterval(autoRefreshTimer);
        autoRefreshTimer = null;
    }
    
    const wrap = document.getElementById('autoRefreshWrap');
    
    if (seconds > 0) {
        console.log(` Auto-refresh started: every ${seconds}s`);
        if (wrap) wrap.classList.add('active');
        
        autoRefreshTimer = setInterval(() => {
            // نُحدّث التبويب الحالي
            if (typeof switchTab === 'function' && currentTab) {
                switchTab(currentTab);
            }
            updateLastUpdate();
        }, seconds * 1000);
        
        // حفظ التفضيل
        try {
            localStorage.setItem('bi_autoRefresh', seconds.toString());
        } catch(e) {}
    } else {
        console.log(' Auto-refresh stopped');
        if (wrap) wrap.classList.remove('active');
        try {
            localStorage.setItem('bi_autoRefresh', '0');
        } catch(e) {}
    }
}

// 
// تحديث getCompareParam لتشمل التاريخ المخصص
// 
function getRangeParams() {
    let params = `range_type=${currentRange}`;
    
    // التاريخ المخصص
    if (currentRange === 'custom' && customFromDate && customToDate) {
        params += `&from_date=${customFromDate}T00:00:00&to_date=${customToDate}T23:59:59`;
    }
    
    // المقارنة
    if (compareWith) {
        params += `&compare_with=${compareWith}`;
    }
    
    return params;
}

function getCompareParam() {
    return compareWith ? `&compare_with=${compareWith}` : '';
}

function renderChangeBadge(change) {
    if (change === null || change === undefined || change === 0) {
        return '';
    }
    const isUp = change > 0;
    const icon = isUp ? '' : '';
    const cls = isUp ? 'up' : 'down';
    const sign = isUp ? '+' : '';
    return `<div class="kpi-change ${cls}">${icon} ${sign}${change}%</div>`;
}

function updateLastUpdate() {
    const now = new Date();
    const t = now.toLocaleTimeString(LANG === 'ar' ? 'ar-SA' : 'en-GB', { hour: '2-digit', minute: '2-digit' });
    const el = document.getElementById('lastUpdate');
    if (el) el.textContent = t;
}

function switchTab(tab, event) {
    currentTab = tab;
    document.querySelectorAll('.bi-tab').forEach(t => t.classList.remove('active'));
    if (event && event.target) {
        const btn = event.target.closest('.bi-tab');
        if (btn) btn.classList.add('active');
    } else {
        // تفعيل التبويب الأول عند التحميل
        const btn = document.querySelector(`.bi-tab[onclick*="${tab}"]`);
        if (btn) btn.classList.add('active');
    }

    const loaders = {
        overview: loadOverview,
        branches: loadBranchesTab,
        buses: loadBusesTab,
        employees: loadEmployeesTab,
        trips: loadTripsTab,
        cities: loadCitiesTab,
        financial: loadFinancialTab,
        customers: loadCustomersTab,
        recommendations: loadRecommendationsTab,
    };

    (loaders[tab] || (() => showPlaceholder(tab)))();
}

function showPlaceholder(tab) {
    document.getElementById('biContent').innerHTML =
        `<div class="chart-card col-12"><div class="chart-card-body text-center py-5">
            <i class="fas fa-tools fa-3x text-muted mb-3"></i>
            <h5>${tab}</h5><p class="text-muted">قيد التطوير</p>
        </div></div>`;
}

// 
// Helper Builders
// 


function chartCard(colClass, icon, color, title, subtitle, canvasId, height) {
    const h = height || 240;
    return `
    <div class="chart-card ${colClass}">
        <div class="chart-card-header">
            <h6 class="chart-card-title"><i class="fas ${icon} text-${color}"></i> ${title}</h6>
            ${subtitle ? `<span class="chart-card-subtitle">${subtitle}</span>` : ''}
        </div>
        <div class="chart-card-body">

function tableCard(colClass, icon, color, title, subtitle, tableHTML) {
    return `
    <div class="chart-card ${colClass}">
        <div class="chart-card-header">
            <h6 class="chart-card-title"><i class="fas ${icon} text-${color}"></i> ${title}</h6>
            ${subtitle ? `<span class="chart-card-subtitle">${subtitle}</span>` : ''}
        </div>
        <div class="chart-card-body">
            <div class="table-responsive">${tableHTML}</div>
        </div>
    </div>`;
}

function destroyChart(key) {
    if (charts[key]) { charts[key].destroy(); charts[key] = null; }
}

// 
// renderKPIs  يعمل في كل التبويبات
// 


// 
// renderKPIs  الدالة الموحدة
// 
function renderKPIs(items) {
    if (!Array.isArray(items)) return '';
    const cardsHTML = items.map(i => {
        const colorCls = i.color === 'primary' ? '' : i.color;
        const badge = i.change !== undefined ? renderChangeBadge(i.change) : '';
        const subtitle = i.subtitle ? `<div class="kpi-subtitle">${i.subtitle}</div>` : '';
        return `<div class="kpi-card ${colorCls}" style="flex:1 1 0;min-width:0;">
            <div class="kpi-header">
                <i class="fas ${i.icon} kpi-icon text-${i.color}"></i>
                <div class="kpi-label">${i.label}</div>
            </div>
            <div class="kpi-value">${i.value}</div>
            ${subtitle}
            ${badge}
        </div>`;
    }).join('');
    
    return `<div class="kpi-row" style="display:flex !important;flex-wrap:nowrap !important;gap:6px !important;width:100% !important;">${cardsHTML}</div>`;
}

function renderOverviewCharts(data) {
    const cmp = data.comparison || {};

    // 1) Line Revenue
    const c1 = document.getElementById('revenueChart');
    if (c1) {

                borderColor: '#94a3b8',
                backgroundColor: 'transparent',
                borderDash: [5, 5],
                tension: 0.4, fill: false,
                borderWidth: 2,
                pointRadius: 0,
            });
        }
        
        charts.revenue = new Chart(c1, {
            type: 'line',
            data: {
                labels: data.daily_revenue.map(d => d.date.slice(5)),
                datasets: datasets,

            options: {
                plugins: {
                    legend: { display: hasCompare, position: 'bottom', labels: { font: { size: 10 }, padding: 8 } },
                },
                scales: { y: { beginAtZero: true, ticks: { callback: v => formatShortCurrency(v) } } }
            }
        });
    }

    // 2) Donut Sources
    const c2 = document.getElementById('sourcesChart');
    if (c2) {
        const src = data.sources;
        const map = { office: ['مكتب', '#0d6efd'], online: ['أونلاين', '#198754'],
                      app: ['تطبيق', '#ffc107'], web: ['موقع', '#0dcaf0'] };
        const labels = [], values = [], colors = [];
        Object.keys(src).forEach(key => {
            if (src[key] > 0 && map[key]) { labels.push(map[key][0]); values.push(src[key]); colors.push(map[key][1]); }
        });
        if (!values.length) { labels.push('لا توجد'); values.push(1); colors.push('#e2e8f0'); }
        destroyChart('sources');
        charts.sources = new Chart(c2, {
            type: 'doughnut',
            data: { labels, datasets: [{ data: values, backgroundColor: colors, borderWidth: 0 }] },
            options: { cutout: '60%', plugins: { legend: { position: 'bottom' } } }
        });
    }

    // 3) Bar Monthly

    if (c3) {
        destroyChart('monthly');
        charts.monthly = new Chart(c3, {
            type: 'bar',

            type: 'bar',

            fetchTabData('trips'),
            fetch(`/bi/luggage?${getRangeParams()}`).then(r => r.json()),
            fetch(`/bi/occupancy?${getRangeParams()}`).then(r => r.json()),
            fetch(`/bi/heatmap?${getRangeParams()}`).then(r => r.json()),

            `<div class="alert alert-danger m-3">فشل التحميل: ${e.message}</div>`;
        return;
    }

    // حفظ البيانات للاستخدام في تبويبات داخلية
    window._tripsData = tripsData;

    //

    <div class="subtabs-dropdown-wrap ${LANG === 'ar' ? 'rtl' : 'ltr'}">
        <div class="subtabs-dropdown" id="tripsDropdown">
            <button class="subtabs-toggle" onclick="toggleSubtabsMenu(event)">

                <span class="subtabs-toggle-label" id="subtabToggleLabel">الرحلات</span>

                <i class="fas fa-chevron-down subtabs-toggle-arrow"></i>
            </button>
            <div class="subtabs-menu ${LANG === 'ar' ? 'rtl' : 'ltr'}" id="subtabsMenu">
                <button class="subtabs-menu-item active" onclick="switchSubtab('trips-overview', event)">
                    <span class="subtabs-menu-item-icon"><i class="fas fa-route"></i></span>
                    <span class="subtabs-menu-item-label">الرحلات</span>
                    <span class="subtabs-menu-item-badge">${tripsData.total}</span>
                    <i class="fas fa-check subtabs-menu-item-check"></i>
                </button>
                <button class="subtabs-menu-item" onclick="switchSubtab('trips-luggage', event)">
                    <span class="subtabs-menu-item-icon"><i class="fas fa-suitcase-rolling"></i></span>
                    <span class="subtabs-menu-item-label">الأمتعة</span>
                    <span class="subtabs-menu-item-badge">${formatShortCurrency(luggageData.kpis.luggage_revenue)}</span>
                    <i class="fas fa-check subtabs-menu-item-check"></i>
                </button>
                <button class="subtabs-menu-item" onclick="switchSubtab('trips-occupancy', event)">
                    <span class="subtabs-menu-item-icon"><i class="fas fa-chart-pie"></i></span>
                    <span class="subtabs-menu-item-label">الإشغال</span>
                    <span class="subtabs-menu-item-badge">${occupancyData.kpis.avg_occupancy}%</span>
                    <i class="fas fa-check subtabs-menu-item-check"></i>
                </button>
                <button class="subtabs-menu-item" onclick="switchSubtab('trips-heatmap', event)">
                    <span class="subtabs-menu-item-icon"><i class="fas fa-fire"></i></span>
                    <span class="subtabs-menu-item-label">أوقات الذروة</span>
                    <span class="subtabs-menu-item-badge"></span>

                </button>

        ${renderTripsOverview(tripsData)}

// 
// Subtabs Functions
// 
function switchSubtab(id, event) {
    // إخفاء/إظهار المحتوى
    document.querySelectorAll('.subtab-content').forEach(c => c.classList.remove('active'));
    const target = document.getElementById('subtab-' + id);
    if (target) target.classList.add('active');

    // تحديث القائمة المنسدلة
    document.querySelectorAll('.subtabs-menu-item').forEach(item => item.classList.remove('active'));
    if (event && event.target) {
        const menuItem = event.target.closest('.subtabs-menu-item');
        if (menuItem) menuItem.classList.add('active');
    }

    // تحديث زر الـ Toggle
    const labelMap = {
        'trips-overview': { label: 'الرحلات', icon: 'fa-route' },
        'trips-luggage': { label: 'الأمتعة', icon: 'fa-suitcase-rolling' },
        'trips-occupancy': { label: 'الإشغال', icon: 'fa-chart-pie' },
    };
    const info = labelMap[id] || { label: id, icon: 'fa-circle' };
    
    const toggleLabel = document.getElementById('subtabToggleLabel');
    const toggleIcon = document.getElementById('subtabToggleIcon');
    const toggleBadge = document.getElementById('subtabToggleBadge');
    const menu = document.getElementById('subtabsMenu');
    const toggle = document.querySelector('.subtabs-toggle');
    
    if (toggleLabel) toggleLabel.textContent = info.label;
    if (toggleIcon) toggleIcon.className = 'fas ' + info.icon;
    
    // Badge
    if (toggleBadge) {
        if (id === 'trips-overview' && window._tripsData) {
            toggleBadge.textContent = window._tripsData.total;
        } else if (id === 'trips-luggage' && window._luggageData) {
            toggleBadge.textContent = formatShortCurrency(window._luggageData.kpis.luggage_revenue);
        } else if (id === 'trips-occupancy' && window._occupancyData) {
            toggleBadge.textContent = window._occupancyData.kpis.avg_occupancy + '%';
        }
    }
    
    // إغلاق القائمة
    if (menu) menu.classList.remove('open');
    if (toggle) toggle.classList.remove('active');

    // رسم الرسوم
    setTimeout(() => {
        if (id === 'trips-overview' && window._tripsData) {
            renderTripsOverviewCharts(window._tripsData);
        } else if (id === 'trips-luggage' && window._luggageData) {
        } else if (id === 'trips-occupancy' && window._occupancyData) {
            renderOccupancyCharts(window._occupancyData);
        } else if (id === 'trips-heatmap') {
            // Heat map لا يحتاج رسم خاص (HTML table)
            applyHeatmapColors();
        }
    }, 50);
}

// 
// Dropdown Toggle Functions
// 
function toggleSubtabsMenu(event) {
    event.stopPropagation();
    const menu = document.getElementById('subtabsMenu');
    const toggle = document.querySelector('.subtabs-toggle');
    if (!menu) return;
    menu.classList.toggle('open');
    if (toggle) toggle.classList.toggle('active');
}

// إغلاق القائمة عند النقر خارجها
document.addEventListener('click', function(e) {
    const dropdown = document.getElementById('tripsDropdown');
    if (dropdown && !dropdown.contains(e.target)) {
        const menu = document.getElementById('subtabsMenu');
        const toggle = document.querySelector('.subtabs-toggle');
        if (menu) menu.classList.remove('open');
        if (toggle) toggle.classList.remove('active');
    }
});

function renderTripsOverview(d) {
    let html = renderKPIs([
        { icon: 'fa-route', color: 'primary', label: 'إجمالي الرحلات', value: d.total },
        { icon: 'fa-check', color: 'success', label: 'مكتملة', value: d.completed },
        { icon: 'fa-clock', color: 'warning', label: 'جارية', value: d.ongoing },
        { icon: 'fa-times', color: 'danger', label: 'ملغاة', value: d.cancelled },
        { icon: 'fa-percentage', color: 'info', label: 'نسبة الإكمال', value: Math.round((d.completed / d.total) * 100) + '%' },
        { icon: 'fa-money-bill-wave', color: 'secondary', label: 'إجمالي الإيراد', value: formatCurrency(d.total_revenue || 531000) },
    ]);

    html += '<div class="chart-grid" style="margin-top:14px;">';
    html += chartCard('col-6', 'fa-chart-bar', 'primary', 'الرحلات حسب الوجهة', 'أعلى 5', 'tripDestChart', 200);
    html += chartCard('col-6', 'fa-chart-line', 'success', 'الرحلات اليومية', '7 أيام', 'tripDailyChart', 200);
    html += '</div>';

    // جدول الرحلات الأكثر ربحية
    const profitRows = d.top_profitable.map((t, i) => `
        <tr>
            <td>${i + 1}</td>
            <td><strong>${t.route}</strong></td>
            <td class="text-center">${t.trips}</td>
            <td class="text-success fw-bold">${formatCurrency(t.revenue)}</td>
            <td><span class="badge bg-success">${t.margin}%</span></td>
        </tr>`).join('');
    const profitTable = `<table class="bi-table">
        <thead><tr><th>#</th><th>الخط</th><th class="text-center">الرحلات</th><th>الإيرادات</th><th>الهامش</th></tr></thead>
        <tbody>${profitRows || '<tr><td colspan="5" class="text-center text-muted">لا توجد بيانات</td></tr>'}</tbody>

    html += '<div class="chart-grid">';
    html += tableCard('col-12', 'fa-trophy', 'warning', 'الرحلات الأكثر ربحية', 'أعلى 5', profitTable);
    html += '</div>';
    return html;
}

function renderLuggageSection(l) {
    let html = renderKPIs([
        { icon: 'fa-money-bill-wave', color: 'success', label: 'إيراد الأمتعة', value: formatCurrency(l.kpis.luggage_revenue) },
        { icon: 'fa-percentage', color: 'primary', label: 'نسبة من الإجمالي', value: l.kpis.percentage + '%' },
        { icon: 'fa-suitcase-rolling', color: 'info', label: 'عدد الأمتعة', value: l.kpis.luggage_count },
        { icon: 'fa-weight-hanging', color: 'warning', label: 'متوسط الوزن', value: l.kpis.avg_weight + ' kg' },
    ]);

    // جدول الأمتعة
    const typeLabels = { free: 'مجاني', small: 'صغير', medium: 'متوسط', large: 'كبير' };
    const typeColors = { free: 'secondary', small: 'info', medium: 'warning', large: 'danger' };
    const totalLuggageRev = l.kpis.luggage_revenue || 1;
    
    const luggageRows = l.by_type.map(t => {
        const pct = ((t.revenue / totalLuggageRev) * 100).toFixed(1);
        const avgPrice = t.count > 0 ? (t.revenue / t.count) : 0;
        return `
        <tr>
            <td><span class="badge bg-${typeColors[t.type] || 'primary'}">${typeLabels[t.type] || t.type}</span></td>
            <td class="text-center">${t.count}</td>
            <td class="text-success fw-bold">${formatCurrency(t.revenue)}</td>
            <td class="text-muted">${formatCurrency(avgPrice)}</td>
            <td>
                <div style="display:flex;align-items:center;gap:6px;">
                    <div style="flex:1;height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden;">
                        <div style="height:100%;width:${pct}%;background:#0d6efd;border-radius:3px;"></div>
                    </div>
                    <small class="fw-bold">${pct}%</small>
                </div>
            </td>
        </tr>`;
    }).join('');
    
    const luggageTable = `
        <table class="bi-table">
            <thead>
                <tr><th>النوع</th><th class="text-center">العدد</th><th>الإيراد</th><th>متوسط السعر</th><th>النسبة</th></tr>
            </thead>
            <tbody>${luggageRows}</tbody>
            <tfoot style="background:#f8fafc;font-weight:800;">
                <tr>
                    <td>الإجمالي</td>
                    <td class="text-center">${l.kpis.luggage_count}</td>
                    <td class="text-success">${formatCurrency(l.kpis.luggage_revenue)}</td>
                    <td class="text-muted">${formatCurrency(l.kpis.luggage_revenue / (l.kpis.luggage_count || 1))}</td>
                    <td><span class="badge bg-primary">${l.kpis.percentage}% من الإيراد</span></td>
                </tr>
            </tfoot>
        </table>`;

    html += '<div class="chart-grid" style="margin-top:14px;">';
    html += tableCard('col-6', 'fa-list', 'primary', 'تفاصيل الأمتعة', 'حسب النوع', luggageTable);
    
    html += '</div>';
    return html;
}

// 
// CITIES
// 
async function loadCitiesTab() {
    let citiesData;
    try {
        const res = await fetch(`/bi/cities?${getRangeParams()}`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        citiesData = await res.json();
    } catch (e) {
        document.getElementById('biContent').innerHTML =
            `<div class="alert alert-danger m-3">فشل التحميل: ${e.message}</div>`;
        return;
    }

    window._citiesData = citiesData;

    const k = citiesData.kpis;
    const cmp = citiesData.comparison || {};

    // حساب عدد الحجوزات والنسبة للأكثر والأقل حجزاً
    const sorted = [...citiesData.list].sort((a, b) => b.bookings - a.bookings);
    const topCity = sorted[0] || { name: '', bookings: 0 };
    const bottomCity = sorted[sorted.length - 1] || { name: '', bookings: 0 };
    const totalBk = k.total_bookings || 1;
    const topPct = Math.round((topCity.bookings / totalBk) * 100);
    const bottomPct = Math.round((bottomCity.bookings / totalBk) * 100);

    // 5 بطاقات KPIs
    let html = renderKPIs([
        { icon: 'fa-map-marked-alt', color: 'primary', label: 'إجمالي المدن', value: k.total },
        { icon: 'fa-trophy', color: 'success', label: 'الأكثر حجزا', value: topCity.name, subtitle: `${topCity.bookings} حجز (${topPct}%)` },
        { icon: 'fa-arrow-down', color: 'danger', label: 'الأقل حجزا', value: bottomCity.name, subtitle: `${bottomCity.bookings} حجز (${bottomPct}%)` },
        { icon: 'fa-route', color: 'info', label: 'إجمالي الرحلات', value: k.total_trips },
        { icon: 'fa-money-bill', color: 'warning', label: 'متوسط الإيراد', value: formatCurrency(k.avg_revenue), change: cmp.revenue_change },
    ]);

    // رسمان
    html += '<div class="chart-grid" style="margin-top:14px;">';
    html += chartCard('col-8', 'fa-chart-bar', 'primary', 'الحجوزات', 'مقارنة المدن', 'citiesChart', 200);
    html += chartCard('col-4', 'fa-chart-pie', 'success', 'التوزيع', 'نسبة', 'citiesDistChart', 200);
    html += '</div>';

    // جدول المدن
    const rows = citiesData.list.filter(c => c.revenue > 0 || c.bookings > 0).map((c, i) => {
        const growthCls = c.growth > 0 ? 'success' : (c.growth < 0 ? 'danger' : 'secondary');
        return `
        <tr>
            <td>${i + 1}</td>
            <td><strong>${c.name}</strong></td>
            <td>${c.code}</td>
            <td class="text-center">${c.bookings}</td>
            <td class="text-success fw-bold">${formatCurrency(c.revenue)}</td>
            <td><span class="badge bg-${growthCls}">${c.growth > 0 ? '+' : ''}${c.growth}%</span></td>
        </tr>`;
    }).join('');

    const emptyMsg = '<tr><td colspan="6" class="text-center text-muted py-3">لا توجد مدن بإيرادات في هذه الفترة</td></tr>';

    const tableHTML = `<table class="bi-table">
        <thead>
            <tr>
                <th>#</th>
                <th>المدينة</th>
                <th>الرمز</th>
                <th class="text-center">الحجوزات</th>
                <th>الإيرادات</th>
                <th>النمو</th>
            </tr>
        </thead>
        <tbody>${rows || emptyMsg}</tbody>
    </table>`;

    html += '<div class="chart-grid">';
    html += tableCard('col-12', 'fa-list', 'secondary', 'بيانات المدن', `${citiesData.list.length} مدينة`, tableHTML);
    html += '</div>';

    document.getElementById('biContent').innerHTML = html;
    setTimeout(() => renderCitiesChartsWithAPI(citiesData), 100);
}

    // 1) Bar  الحجوزات
    const c1 = document.getElementById('citiesChart');
    if (c1) {
        // نعرض فقط المدن التي فيها إيرادات أو حجوزات
        const active = data.list.filter(c => c.revenue > 0 || c.bookings > 0);

function renderRecentBookings(bookings, avgPrice) {
    if (!bookings || !bookings.length) return '<p class="text-muted text-center py-3">لا توجد حجوزات</p>';
    
    const statusMap = {
        'BookingStatus.PENDING': { cls: 'bg-warning', txt: 'معلق' },
        'BookingStatus.CONFIRMED': { cls: 'bg-success', txt: 'مؤكد' },
        'BookingStatus.CANCELLED': { cls: 'bg-danger', txt: 'ملغي' },
    };
    
    const showCompare = compareWith && avgPrice > 0;
    
    let html = '<table class="bi-table"><thead><tr>'
        + '<th>#</th><th>رقم الحجز</th><th>PNR</th><th>المبلغ</th>'
        + (showCompare ? '<th>vs المتوسط</th>' : '')
        + '<th>الحالة</th><th>التاريخ</th></tr></thead><tbody>';
    
    bookings.forEach((b, i) => {
        const s = statusMap[b.status] || { cls: 'bg-secondary', txt: b.status };
        const diff = avgPrice > 0 ? ((b.total_price - avgPrice) / avgPrice * 100) : 0;
        const diffCls = diff > 0 ? 'text-success' : (diff < 0 ? 'text-danger' : 'text-muted');
        const diffIcon = diff > 0 ? '' : (diff < 0 ? '' : '');
        const diffText = showCompare
            ? `<span class="${diffCls} fw-bold">${diffIcon} ${diff > 0 ? '+' : ''}${diff.toFixed(0)}%</span>`
            : '';
        
        html += `<tr>
            <td>${i+1}</td>
            <td><strong class="text-primary">${b.reference}</strong></td>
            <td><small>${b.pnr || '-'}</small></td>
            <td><strong class="text-success">${formatCurrency(b.total_price)}</strong></td>
            ${showCompare ? `<td>${diffText}</td>` : ''}
            <td><span class="badge ${s.cls}">${s.txt}</span></td>
            <td><small>${formatDate(b.booked_at)}</small></td>
        </tr>`;
    });
    return html + '</tbody></table>';
}

function renderRecommendations(data) {
    const recs = generateRecommendations(data);
    if (!recs.length) return '<p class="text-muted text-center py-3">لا توجد توصيات</p>';
    return recs.map(r => `
        <div class="recommendation ${r.type}">
            <div class="recommendation-icon">${r.icon}</div>
            <div class="recommendation-content">
                <h6>${r.title}</h6>
                <p>${r.message}</p>
                <div class="recommendation-impact">${r.impact}</div>
            </div>
        </div>`).join('');
}

function generateRecommendations(data) {
    const recs = [];
    const k = data.kpis;
    if (k.occupancy_rate > 80) {
        recs.push({ type: 'opportunity', icon: '', title: 'فرصة توسع',
            message: `نسبة الإشغال ${k.occupancy_rate}%`, impact: '+15% إيرادات' });
    }
    if (data.branches && data.branches.length > 1) {
        const avg = data.branches.reduce((s, b) => s + b.revenue, 0) / data.branches.length;
        data.branches.forEach(b => {
            if (b.revenue < avg * 0.7 && b.revenue > 0) {
                recs.push({ type: 'warning', icon: '', title: `فرع ${b.name} أقل من المتوسط`,
                    message: formatCurrency(b.revenue), impact: '+10%' });
            }
        });
    }
    recs.push({ type: 'opportunity', icon: '', title: 'دعم القرار',
        message: 'استخدم التبويبات الأخرى', impact: 'قرارات مبنية على البيانات' });
    return recs;
}

// تلوين الخلايا
function applyHeatmapColors() {
    const cells = document.querySelectorAll('.heatmap-cell');
    if (!cells.length) return;
    // نجد أعلى قيمة
    let maxVal = 0;
    cells.forEach(c => {
        const v = parseInt(c.dataset.value) || 0;
        if (v > maxVal) maxVal = v;
    });
    if (maxVal === 0) return;

    cells.forEach(c => {
        const v = parseInt(c.dataset.value) || 0;
        const ratio = v / maxVal;
        if (v === 0) {
            c.style.background = '#f8fafc';
            c.style.color = '#cbd5e1';
        } else {
            // تدرج من فاتح إلى غامق
            const intensity = Math.round(ratio * 100);
            if (ratio >= 0.75) {
                c.style.background = '#dc2626';
                c.style.color = 'white';
            } else if (ratio >= 0.5) {
                c.style.background = '#f97316';
                c.style.color = 'white';
            } else if (ratio >= 0.25) {
                c.style.background = '#fbbf24';
                c.style.color = '#1e293b';
            } else {
                c.style.background = '#fef3c7';
                c.style.color = '#1e293b';
            }
        }
    });
}

// 
// Formatters
// 
function formatCurrency(amount) {
    if (amount == null) return '0';
    const num = parseFloat(amount);
    if (isNaN(num)) return '0';
    if (Math.abs(num) >= 1000000) return (num / 1000000).toFixed(1) + 'M';
    if (Math.abs(num) >= 1000) return (num / 1000).toFixed(0) + 'K';
    return num.toLocaleString();
}
function formatShortCurrency(amount) {
    if (amount == null) return '0';
    const num = parseFloat(amount);
    if (Math.abs(num) >= 1000000) return (num / 1000000).toFixed(1) + 'M';
    if (Math.abs(num) >= 1000) return (num / 1000).toFixed(0) + 'K';
    return num.toFixed(0);
}
function formatDate(dateStr) {
    if (!dateStr) return '-';
    const d = new Date(dateStr);
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

(function() {
    let lastScrollTop = 0;
    const threshold = 80;

    window.addEventListener('scroll', function() {
        const subtabs = document.getElementById('tripsSubtabs');
        if (!subtabs) return;

        const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        const diff = scrollTop - lastScrollTop;

        if (scrollTop > threshold) {
            if (diff > 5) {
                subtabs.classList.add('hidden');
            } else if (diff < -5) {
                subtabs.classList.remove('hidden');
            }
        } else {
            subtabs.classList.remove('hidden');
        }

        lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
    }, { passive: true });
})();

// 
// Force 6 cards in row (يُشغَّل بعد كل render)

function forceKpiLayout() {
    document.querySelectorAll('.kpi-row').forEach(row => {
        row.style.cssText = 'display:flex !important;flex-wrap:nowrap !important;gap:6px !important;width:100% !important;';
        row.querySelectorAll('.kpi-card').forEach(card => {
            card.style.cssText = 'flex:1 1 0 !important;min-width:0 !important;padding:8px 4px !important;min-height:78px !important;box-sizing:border-box !important;';
        });
    });
}

// نشغّلها بعد كل تحديث
const _origSetInner = Element.prototype.innerHTML;
Object.defineProperty(Element.prototype, 'innerHTML', {
    set: function(val) {
        _origSetInner.call(this, val);
        if (this.id === 'biContent') {
            setTimeout(forceKpiLayout, 50);
        }
    },
    get: function() { return _origSetInner.call(this); }
});
