{% extends "base.html" %}

{% block title %}BusCore - {{ _("نتائج البحث") }}{% endblock %}

{% block content %}
<div class="container py-4">
    <h2 class="mb-4">🔍 {{ _("نتائج البحث") }}</h2>

    <div id="resultsContainer">
        <div class="text-center py-5">
            <div class="loading-spinner"></div>
            <p class="mt-3 text-muted">{{ _("جاري البحث عن الرحلات...") }}</p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const LANG = "{{ lang }}";

document.addEventListener('DOMContentLoaded', async function() {
    const params = new URLSearchParams(window.location.search);
    const departureId = params.get('departure');
    const arrivalId = params.get('arrival');
    const date = params.get('date');

    if (!departureId || !arrivalId || !date) {
        document.getElementById('resultsContainer').innerHTML = `
            <div class="alert alert-warning">{{ _("الرجاء تحديد محطة المغادرة والوصول والتاريخ") }}</div>
        `;
        return;
    }

    // ✅ التحقق من التاريخ (لا يقبل الماضي)
    const todayStr = new Date().toISOString().split('T')[0];
    if (date < todayStr) {
        document.getElementById('resultsContainer').innerHTML = `
            <div class="alert alert-danger">
                <i class="fas fa-exclamation-triangle me-2"></i>
                {{ _("لا يمكن البحث عن رحلات في تاريخ سابق") }}
            </div>
        `;
        return;
    }

    try {
        const trips = await BusCoreAPI.searchTrips({
            departure_station_id: departureId,
            arrival_station_id: arrivalId,
            date: date
        });

        const container = document.getElementById('resultsContainer');

        // ✅ حساب "الآن" بـ UTC بدقة
        const nowMs = Date.now();
        const TWO_HOURS_MS = 2 * 60 * 60 * 1000;

        // دالة مساعدة: تحويل وقت الرحلة إلى ms بطريقة آمنة (UTC)
        function tripDepartureMs(trip) {
            if (!trip.departure_time) return 0;
            let s = String(trip.departure_time);
            // إذا لم يكن يحتوي على Z أو +، اعتبره UTC
            if (!s.endsWith('Z') && !s.includes('+')) {
                // إزالة أي جزء زمني إن وُجد بدون timezone
                s = s.replace(/\s*[+-]\d{2}:?\d{2}$/, '');
                s = s + 'Z';
            }
            return new Date(s).getTime();
        }

        // تصفية: نُبقي الرحلات التي تنطلق بعد ساعتين على الأقل
        const availableTrips = trips.filter(trip => {
            const depMs = tripDepartureMs(trip);
            return (depMs - nowMs) >= TWO_HOURS_MS;
        });

        // ✅ تشخيص (يظهر في Console فقط)
        console.log('🔍 عدد الرحلات الكلي:', trips.length);
        console.log('🔍 الرحلات المتاحة (بعد ساعتين):', availableTrips.length);
        trips.forEach(t => {
            const depMs = tripDepartureMs(t);
            const hoursLeft = ((depMs - nowMs) / 3600000).toFixed(1);
            console.log(`   - رحلة ${t.id}: بعد ${hoursLeft} ساعة | ${t.route || t.route_en}`);
        });

        // ⚠️ لا نُظهر رسالة "النافذة مغلقة" إلا إذا كان هناك رحلات فعلاً لكن كلها قريبة
        if (trips.length > 0 && availableTrips.length === 0) {
            container.innerHTML = `
                <div class="alert alert-warning text-center" style="border-right: 5px solid #ffc107;">
                    <h5 class="alert-heading">
                        <i class="fas fa-clock me-2"></i>{{ _("انتهى وقت الحجز الإلكتروني") }}
                    </h5>
                    <hr>
                    <p class="mb-2">{{ _("الرحلات المتاحة تنطلق خلال أقل من ساعتين.") }}</p>
                    <p class="mb-0">
                        <strong>{{ _("يرجى التواصل مع مكتب الحجز:") }}</strong>
                        <br>
                        <a href="tel:+249917764577" class="btn btn-sm btn-primary mt-2">
                            <i class="fas fa-phone me-1"></i> 917764577
                        </a>
                        <a href="https://wa.me/249917764577" target="_blank" class="btn btn-sm btn-success mt-2 ms-1">
                            <i class="fab fa-whatsapp me-1"></i> WhatsApp
                        </a>
                    </p>
                </div>
            `;
            return;
        }

        // استخدام الرحلات المتاحة
        const validTrips = availableTrips;

        if (validTrips.length === 0) {
            container.innerHTML = `
                <div class="text-center py-5">
                    <i class="fas fa-bus fa-4x text-muted mb-3"></i>
                    <h4>{{ _("لا توجد رحلات متاحة") }}</h4>
                    <p class="text-muted">{{ _("حاول تغيير التاريخ أو اختيار مسار آخر") }}</p>
                    <a href="/" class="btn btn-primary mt-3">{{ _("بحث جديد") }}</a>
                </div>
            `;
            return;
        }

        const seatsLabel = "{{ _('مقعد متاح') }}";
        const fullLabel = "{{ _('مكتمل') }}";
        const busNumberLabel = "{{ _('رقم الحافلة') }}";
        const priceLabel = "{{ _('السعر') }}";
        const selectTripLabel = "{{ _('اختر هذه الرحلة') }}";
        const notAvailableLabel = "{{ _('غير متاح') }}";

        let html = '<div class="row g-4">';
        validTrips.forEach((trip, index) => {
            const isAvailable = trip.available_seats > 0;
            html += `
                <div class="col-md-6 col-lg-4">
                    <div class="card h-100">
                        <div class="card-header d-flex justify-content-between">
                            <span class="badge bg-${isAvailable ? 'success' : 'danger'}">
                                ${isAvailable ? `${trip.available_seats} ${seatsLabel}` : fullLabel}
                            </span>
                            <span class="text-muted small">${formatDate(trip.departure_time)}</span>
                        </div>
                        <div class="card-body">
                            <h5 class="card-title">${(LANG === 'en' && trip.route_en) ? trip.route_en : trip.route}</h5>
                            <div class="d-flex justify-content-between mt-3">
                                <div>
                                    <small class="text-muted">${busNumberLabel}</small>
                                    <strong>${trip.bus_number}</strong>
                                </div>
                                <div>
                                    <small class="text-muted">${priceLabel}</small>
                                    <strong class="text-success">${formatCurrency(trip.price)}</strong>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer bg-transparent">
                            <button class="btn ${isAvailable ? 'btn-primary' : 'btn-secondary'} w-100 select-trip"
                                    data-trip='${JSON.stringify(trip)}'
                                    ${!isAvailable ? 'disabled' : ''}>
                                ${isAvailable ? selectTripLabel : notAvailableLabel}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        });
        html += '</div>';
        container.innerHTML = html;

        document.querySelectorAll('.select-trip').forEach(btn => {
            btn.addEventListener('click', function() {
                const tripData = JSON.parse(this.dataset.trip);
                localStorage.setItem('selected_trip', JSON.stringify(tripData));
                window.location.href = '/booking';
            });
        });

    } catch (error) {
        document.getElementById('resultsContainer').innerHTML = `
            <div class="alert alert-danger">{{ _("حدث خطأ") }}: ${error.message}</div>
        `;
    }
});

function formatDate(dateString) {
    const date = new Date(dateString);
    const locale = LANG === 'ar' ? 'ar-SA' : 'en-GB';
    return date.toLocaleDateString(locale, {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
    });
}

function formatCurrency(amount) {
    const locale = LANG === 'ar' ? 'ar-SD' : 'en-SD';
    return new Intl.NumberFormat(locale, {
        style: 'currency',
        currency: 'SDG',
        minimumFractionDigits: 0
    }).format(amount);
}
</script>
{% endblock %}
